name: Employee Management CI


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  packages: write
jobs:
  backend-tests:
    name: Run FastAPI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Run Automated Tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m pytest -v
  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/ranjeshmishra/employee-backend:latest
            ghcr.io/ranjeshmishra/employee-backend:${{ github.sha }}
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/ranjeshmishra/employee-frontend:latest
            ghcr.io/ranjeshmishra/employee-frontend:${{ github.sha }}
  gitops-update:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update GitOps Deployment Images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E "s|ghcr.io/ranjeshmishra/employee-backend:[^[:space:]]+|ghcr.io/ranjeshmishra/employee-backend:${IMAGE_TAG}|g" k8s/app/backend-deployment.yaml
          sed -i -E "s|ghcr.io/ranjeshmishra/employee-frontend:[^[:space:]]+|ghcr.io/ranjeshmishra/employee-frontend:${IMAGE_TAG}|g" k8s/app/frontend-deployment.yaml

      - name: Commit and Push GitOps Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- k8s/app/backend-deployment.yaml k8s/app/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes required."
            exit 0
          fi

          git commit -m "gitops: update deployment images to ${GITHUB_SHA}"
          git push origin HEAD:main
